name: CI - Placeholder2 Service

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: lmbek/lmbek-hobby-placeholder2-service

jobs:
  test-build-scan-push:
    name: Test, build, scan, and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Set up Go
        uses: actions/setup-go@v5.5.0
        with:
          go-version: '1.26.x'
          cache: true

      - name: Format, vet, and test
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...

      - name: Scan Go dependencies
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.11.1

      - name: Build image for scanning
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan container image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish immutable and production tags
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          image="${REGISTRY}/${IMAGE_NAME}"
          docker push "${image}:sha-${GITHUB_SHA}"
          docker tag "${image}:sha-${GITHUB_SHA}" "${image}:production"
          docker push "${image}:production"

