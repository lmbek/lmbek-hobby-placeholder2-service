name: CI/CD Pipeline - Placeholder2 Service

on:
  push:
    branches:
      - main
  release:
    types: [published]
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment to build and tag (staging or production)'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: lmbek/lmbek-hobby-placeholder2-service

jobs:
  build-and-push:
    name: Build & Publish Container Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true

      - name: Test Go Service
        run: go test -v ./...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata (Staging on push to main, Production on release)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # 1. Staging tags: Triggered automatically on push to main
            type=raw,value=staging-latest,enable=${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging') }}
            type=raw,value=staging,enable=${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging') }}
            type=sha,prefix=staging-,enable=${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging') }}
            # 2. Production tags: Triggered on GitHub Release published
            type=raw,value=latest,enable=${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'production') }}
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}},enable=${{ github.event_name == 'release' }}
            type=sha,format=short,enable=${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'production') }}
            # 3. Pull Request previews (test builds without pushing)
            type=ref,event=pr

      - name: Build and Push Container Image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start automated staging promotion
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.PLATFORM_REPOSITORY_TOKEN }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error title=Missing repository secret::Add PLATFORM_REPOSITORY_TOKEN to this repository's Actions secrets. It needs Contents and Pull requests write access to lmbek/lmbek-hobby-platform."
            exit 1
          fi
          curl --fail-with-body --request POST \
            --url https://api.github.com/repos/lmbek/lmbek-hobby-platform/dispatches \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data "$(jq -n --arg image \"$IMAGE_NAME\" --arg digest \"$IMAGE_DIGEST\" --arg commit \"$GITHUB_SHA\" '{event_type:"image-published",client_payload:{image:$image,digest:$digest,commit:$commit}}')"
